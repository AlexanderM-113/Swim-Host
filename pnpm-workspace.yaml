# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Requires that any npm package version has been published for at least 1 day
# (1440 minutes) before pnpm will install it. Protects against supply-chain
# attacks — malicious releases are usually caught within hours.
#
# DO NOT DISABLE THIS SETTING.
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - electron
  - lib/*
  - scripts

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - better-sqlite3
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit uses esbuild internally on an older version that's vulnerable
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
