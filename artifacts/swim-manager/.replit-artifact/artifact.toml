kind = "web"
previewPath = "/"
title = "SwimManager Pro"
version = "1.0.0"
id = "artifacts/swim-manager"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21868

[services.development]
run = "pnpm --filter @workspace/swim-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/swim-manager", "run", "build" ]
publicDir = "artifacts/swim-manager/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21868"
BASE_PATH = "/"
